name: Pages
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      # Fails until Pages is switched on (Settings → Pages → Source: GitHub Actions); skip quietly till then.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome != 'success'
        run: echo "::notice::GitHub Pages is off. Settings → Pages → Source → GitHub Actions publishes the site on the next push."
      - if: steps.pages.outcome == 'success'
        uses: actions/checkout@v5
      - if: steps.pages.outcome == 'success'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.pages.outcome == 'success'
        run: npm ci && npm run build
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
